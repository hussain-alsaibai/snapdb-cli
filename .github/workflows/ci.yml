name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The library is imported as `snapdb` but distributed as `pysnapdb`, and the
  # PyPI release (0.14.0) lags the repository (0.18.0). Installing the
  # repository, not the wheel, is what makes these tests meaningful: the CLI
  # was written against an API that no longer exists, and a stale wheel would
  # have hidden that.
  SNAPDB_REPO: https://github.com/hussain-alsaibai/snapdb.git

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install snapdb from source and pytest
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install "git+${SNAPDB_REPO}"

      - name: Prove the import is the repo version, not a stray wheel
        run: |
          set -e
          python - <<'PY'
          import subprocess, sys
          import snapdb
          actual = getattr(snapdb, "__version__", "unknown")
          expected = subprocess.run(
              [sys.executable, "-m", "pip", "show", "pysnapdb"],
              capture_output=True, text=True,
          ).stdout
          print("import: snapdb", actual)
          assert "pysnapdb" in expected, expected
          assert actual != "unknown", "snapdb imported but declared no version"
          PY

      - name: Run tests
        run: python -m pytest -q

  readme-examples:
    # The README is the only documentation this CLI has, and before 2026-11-09
    # every command in it failed. This job runs the documented walkthrough
    # verbatim so a doc that drifts from the code fails CI instead of a user.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install snapdb from source
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install "git+${SNAPDB_REPO}"

      - name: Run every command in the README quick start
        run: |
          set -e
          D="--path ./demo"
          mkdir -p demo
          python snapdb_cli.py init users id:i32,name:bytes:16,email:bytes:32 $D
          python snapdb_cli.py insert users '{"id": 1, "name": "alice", "email": "alice@example.com"}' $D
          python snapdb_cli.py insert users '{"id": 2, "name": "bob", "email": "bob@example.com"}' $D
          python snapdb_cli.py get users 0 $D
          python snapdb_cli.py list users --limit 100 $D
          python snapdb_cli.py count users $D
          python snapdb_cli.py schema users $D
          python snapdb_cli.py stats users $D
          python snapdb_cli.py export users --format json $D
          # Exporting must round-trip through a JSON parser, not just print.
          python snapdb_cli.py export users --format json $D > out.json
          python -c "import json;d=json.load(open('out.json'));assert len(d)==2, d;print('round-trip ok:', len(d), 'rows')"

      - name: Assert the README install block names the real package
        run: |
          set -e
          # `pip install snapdb` fetches an unrelated PyPI project. The README
          # must not tell users to do that.
          if grep -nE '^\s*pip install snapdb\s*$' README.md; then
            echo "::error::README tells users to 'pip install snapdb', which is a different project on PyPI"
            exit 1
          fi
